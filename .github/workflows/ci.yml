# Testes e builds a cada push/PR. O job "docker" constrói as duas imagens e sobe a API
# com um Postgres para conferir migrações e o /api/health, como no Easypanel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: API, web e shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @etiquetas/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @etiquetas/web build

  agente:
    name: Agente (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etiquetas
          POSTGRES_PASSWORD: etiquetas
          POSTGRES_DB: etiquetas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U etiquetas" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: etiquetas
          MYSQL_DATABASE: etiquetas
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -petiquetas" --health-interval 5s --health-timeout 5s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Etiquetas-123
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Etiquetas-123 -Q 'SELECT 1'" --health-interval 10s --health-timeout 10s --health-retries 30
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
        env:
          AGENTE_TESTE_PG: localhost:5432:etiquetas:etiquetas:etiquetas
          AGENTE_TESTE_MYSQL: 127.0.0.1:3306:root:etiquetas:etiquetas
          AGENTE_TESTE_MSSQL: 127.0.0.1:1433:sa:Etiquetas-123:master
      - name: Bancos de verdade realmente rodaram (sem Skip)
        run: go test ./internal/banco -run 'TestMySQLReal|TestSQLServerReal|TestPostgresReal' -v | tee /dev/stderr | grep -c -- '--- PASS' | grep -qx 3
        env:
          AGENTE_TESTE_PG: localhost:5432:etiquetas:etiquetas:etiquetas
          AGENTE_TESTE_MYSQL: 127.0.0.1:3306:root:etiquetas:etiquetas
          AGENTE_TESTE_MSSQL: 127.0.0.1:1433:sa:Etiquetas-123:master

  e2e:
    name: Telas e API de ponta a ponta
    # Versão fixa: o Playwright só instala dependências em sistemas que conhece.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etiquetas
          POSTGRES_PASSWORD: etiquetas
          POSTGRES_DB: etiquetas_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U etiquetas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://etiquetas:etiquetas@localhost:5432/etiquetas_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build web do aplicativo
        working-directory: apps/mobile
        run: |
          npm ci
          npm test
          npm run typecheck
          npx expo export -p web
      - run: pnpm --filter @etiquetas/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @etiquetas/e2e e2e
        env:
          E2E_APP_URL: http://localhost:8099
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-resultados
          path: apps/e2e/test-results

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [node, agente, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build da API
        run: docker build -f apps/api/Dockerfile -t etiquetas-api .
      - name: Build do web (com o agente)
        run: docker build -f apps/web/Dockerfile --build-arg SERVIDOR_PUBLICO=https://exemplo.invalid --build-arg VERSAO=${GITHUB_SHA::7} -t etiquetas-web .
      - name: Sobe Postgres, API e web e confere
        run: |
          set -e
          docker network create etq
          docker run -d --name postgres --network etq -e POSTGRES_USER=etiquetas -e POSTGRES_PASSWORD=etiquetas -e POSTGRES_DB=etiquetas postgres:16-alpine
          for i in $(seq 1 30); do docker exec postgres pg_isready -U etiquetas && break; sleep 1; done
          docker run -d --name api --network etq \
            -e DATABASE_URL=postgresql://etiquetas:etiquetas@postgres:5432/etiquetas \
            -e JWT_SECRET=$(openssl rand -base64 48) \
            -e CHAVE_CRIPTOGRAFIA=$(openssl rand -base64 32) \
            -e SUPERADMIN_EMAIL=ci@exemplo.invalid -e SUPERADMIN_SENHA=senha-do-ci-123 \
            etiquetas-api
          docker run -d --name web --network etq -e API_UPSTREAM=http://api:3000 -p 8080:80 etiquetas-web
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
          curl -fsS http://localhost:8080/api/health | grep '"banco":"ok"'
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/downloads/etiquetas-agente.exe
          curl -fsS http://localhost:8080/downloads/versao.txt
          if [ -s apps/mobile/release-publicada.txt ]; then
            curl -fsS http://localhost:8080/downloads/app-versao.txt
            test "$(curl -fsS http://localhost:8080/downloads/etiquetas-app.apk | wc -c)" -gt 1000000
          fi
          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@exemplo.invalid","senha":"senha-do-ci-123"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          test -n "$token"
          echo "Login pelo nginx ok"
          # Prévia de link: o robô do WhatsApp recebe a página da API (com og:title); o navegador, o site.
          curl -sS -A "WhatsApp/2.24.1 A" http://localhost:8080/loja/naoexiste1234 | grep -q "og:title"
          curl -sS -A "WhatsApp/2.24.1 A" http://localhost:8080/loja/pedido/naoexiste1234 | grep -q "og:title"
          curl -fsS -A "Mozilla/5.0" http://localhost:8080/loja/naoexiste1234 | grep -q "id=\"root\""
          echo "Prévia de link pelo nginx ok"
      - name: Logs em caso de falha
        if: failure()
        run: docker logs api; docker logs web
