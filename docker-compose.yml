# Serviços de apoio para desenvolvimento local (API e web rodam com pnpm).
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etiquetas
      POSTGRES_PASSWORD: etiquetas
      POSTGRES_DB: etiquetas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
